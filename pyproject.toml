[project]
name = "shijhon-catalog-musicbrainz"
version = "0.1.0b1"
description = "A MusicBrainz catalog adapter for Shijhon"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jasshl" }]
dependencies = [
    "shijhon>=0.1.0b1",
    "anyio>=4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

# Shijhon finds the adapter here: [catalog] kind = "musicbrainz".
[project.entry-points."shijhon.catalogs"]
musicbrainz = "shijhon_catalog_musicbrainz:adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shijhon_catalog_musicbrainz"]

# Shijhon itself is not on a package index: its checkout next to this one.
[tool.uv.sources]
shijhon = { path = "../shijhon", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: asks the real services (opt-in: MUSICBRAINZ_LIVE_SEARCH=<term> pytest -m live)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]
